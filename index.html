<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Solar System 3D</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=4">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script>
    // If the 3D code fails to load, say so instead of showing a blank screen
    window.addEventListener('error', function (e) {
      var m = document.getElementById('loaderMsg');
      if (m) m.textContent = 'Error: ' + e.message + ' (' + (e.filename || '').split('/').pop() + ')';
    }, true);
  </script>
</head>
<body>
  <div id="scene"></div>

  <!-- ===== Space view ===== -->
  <header class="topbar">
    <div>
      <h1>Solar System</h1>
      <p class="hint">Drag to rotate · Pinch to zoom · Tap a planet</p>
      <p id="totalPop" class="hint pop"></p>
    </div>
    <div class="top-actions">
      <button id="badgeBtn" class="pill icon" aria-label="Badges">🏅</button>
      <button id="settingsBtn" class="pill icon" aria-label="Settings">⚙️</button>
    </div>
  </header>

  <aside id="card" class="card" aria-hidden="true">
    <button id="closeBtn" class="close" aria-label="Back to solar system">✕</button>
    <div class="card-head">
      <img id="cardThumb" class="thumb" alt="">
      <div>
        <h2 id="cardName"></h2>
        <p id="cardAbout" class="about"></p>
      </div>
    </div>
    <div class="moon-count">
      <span id="moonNum" class="num"></span>
      <span id="moonLabel" class="lbl"></span>
    </div>
    <p id="moonTitle" class="section-title">Major moons (shown in 3D)</p>
    <ul id="moonList" class="moon-list"></ul>
    <p id="cardNote" class="note"></p>
    <p id="cardWorld" class="card-world"></p>
    <button id="landBtn" class="land-btn">🚀 Land</button>
  </aside>

  <!-- ===== Planet surface ===== -->
  <div id="surfaceUI" class="surface-ui hidden">
    <div class="s-top">
      <button id="takeOffBtn" class="pill">🚀 Take off</button>
      <div class="s-title"><b id="sName"></b><span id="sStats"></span></div>
      <button id="undoBtn" class="pill icon" aria-label="Undo">↶</button>
      <button id="photoBtn" class="pill icon" aria-label="Take photo">📷</button>
      <button id="menuBtn" class="pill icon" aria-label="Menu">⋮</button>
    </div>
    <div id="sHint" class="s-hint"></div>
    <div id="swatchRow" class="swatch-row hidden"></div>
    <div id="selBar" class="sel-bar hidden">
      <button data-act="rotate">⟳<span>Rotate</span></button>
      <button data-act="move">✥<span>Move</span></button>
      <button data-act="paint">🎨<span>Colour</span></button>
      <button data-act="copy">⧉<span>Copy</span></button>
      <button data-act="bigger">＋<span>Bigger</span></button>
      <button data-act="smaller">－<span>Smaller</span></button>
      <button data-act="launch">🚀<span>Launch</span></button>
      <button data-act="delete">🗑<span>Delete</span></button>
      <button data-act="done">✓<span>Done</span></button>
    </div>
    <div id="palette" class="palette"></div>
  </div>

  <!-- ===== Shared overlays ===== -->
  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <button id="modalClose" class="close" aria-label="Close">✕</button>
      <div id="modalBody"></div>
    </div>
  </div>
  <input id="restoreInput" type="file" accept=".json,application/json" hidden>
  <div id="toast" class="toast"></div>
  <div id="flash"></div>
  <div id="fade"></div>

  <div id="loader">
    <div class="loader-box">
      <p>Loading the solar system…</p>
      <div class="bar"><span id="barFill"></span></div>
      <p id="loaderMsg" class="loader-msg"></p>
    </div>
  </div>

  <footer class="credit">
    Textures: <a href="https://www.solarsystemscope.com/textures/" target="_blank" rel="noopener">Solar System Scope</a> (CC BY 4.0)
  </footer>

  <script type="module" src="script.js?v=4"></script>
</body>
</html>
