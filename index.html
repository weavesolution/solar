<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Solar Office</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=5">
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script>
    // If the 3D code fails to load, say so instead of showing a blank screen
    window.addEventListener('error', function (e) {
      var m = document.getElementById('loaderMsg');
      if (m) m.textContent = 'Error: ' + e.message + ' (' + (e.filename || '').split('/').pop() + ')';
    }, true);
  </script>
</head>
<body>
  <div id="scene"></div>

  <!-- ===== Space view ===== -->
  <header class="topbar">
    <div>
      <h1>Solar Office</h1>
      <p class="hint">Each planet is a company · tap the Sun for an overview</p>
    </div>
    <div class="top-actions">
      <button id="searchBtn" class="pill icon" aria-label="Find">🔍</button>
      <button id="settingsBtn" class="pill icon" aria-label="Settings">⚙️</button>
    </div>
  </header>

  <aside id="card" class="card" aria-hidden="true">
    <button id="closeBtn" class="close" aria-label="Back to solar system">✕</button>
    <div id="cardInner"></div>
  </aside>

  <!-- ===== Street (on a planet) ===== -->
  <div id="surfaceUI" class="surface-ui hidden">
    <div class="s-top">
      <button id="takeOffBtn" class="pill">🚀 Take off</button>
      <div class="s-title"><b id="sName"></b><span id="sSub"></span></div>
      <button id="dirBtn" class="pill icon" aria-label="Buildings on this street">🏢</button>
      <button id="searchBtn2" class="pill icon" aria-label="Find">🔍</button>
      <button id="settingsBtn2" class="pill icon" aria-label="Settings">⚙️</button>
    </div>
    <div class="s-hint">Joystick to walk · drag to look · tap a window</div>
    <div id="joy" class="joy" aria-label="Walk"><div id="joyKnob" class="joy-knob"></div></div>
  </div>

  <!-- ===== Panels ===== -->
  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <button id="modalClose" class="close" aria-label="Close">✕</button>
      <div id="modalBody"></div>
    </div>
  </div>
  <input id="restoreInput" type="file" accept=".json,application/json" hidden>
  <div id="toast" class="toast"></div>
  <div id="fade"></div>

  <div id="loader">
    <div class="loader-box">
      <p>Loading your solar office…</p>
      <div class="bar"><span id="barFill"></span></div>
      <p id="loaderMsg" class="loader-msg"></p>
    </div>
  </div>

  <footer class="credit">
    Textures: <a href="https://www.solarsystemscope.com/textures/" target="_blank" rel="noopener">Solar System Scope</a> (CC BY 4.0)
  </footer>

  <script type="module" src="script.js?v=5"></script>
</body>
</html>
